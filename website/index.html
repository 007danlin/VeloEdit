<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <meta name="description" content="VeloEdit — видеоредактор для macOS с локальным AI. Готовим новый сайт. Скоро на veloedit.ru.">
  <title>VeloEdit — скоро</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101211; color: #f2f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; }
    .page { min-height: 100svh; max-width: 1600px; margin: auto; padding: 36px 6vw 28px; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 650; letter-spacing: -.7px; }
    .mark { width: 31px; height: 31px; color: #c8ff7a; }
    .domain { color: #9ca397; font-size: 13px; }
    main { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 6vw; padding: 100px 0; }
    .status { display: inline-flex; gap: 9px; align-items: center; color: #c8ff7a; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; }
    .status::before { content: ""; height: 6px; width: 6px; border-radius: 50%; background: currentColor; }
    h1 { font-size: clamp(68px, 8.5vw, 130px); font-weight: 550; line-height: .98; letter-spacing: -.07em; margin: 28px 0; }
    h1 span { color: #c8ff7a; }
    p { max-width: 390px; color: #aeb5a9; font-size: 18px; line-height: 1.65; margin: 0; }
    .link { display: inline-flex; align-items: center; gap: 28px; margin-top: 34px; padding: 15px 20px; border-radius: 9px; border: 1px solid #424b3b; color: #f2f4ef; text-decoration: none; font-size: 14px; transition: background .2s, border-color .2s; }
    .link:hover { background: #222b1c; border-color: #c8ff7a; }
    .link:focus-visible { outline: 3px solid #c8ff7a; outline-offset: 5px; }
    .visual { position: relative; aspect-ratio: 1; display: grid; place-items: center; isolation: isolate; }
    .visual::before { content: ""; position: absolute; inset: 0; border: 1px solid #283024; border-radius: 50%; }
    .visual::after { content: ""; position: absolute; inset: 15%; border: 1px solid #283024; border-radius: 50%; z-index: -1; background: radial-gradient(circle, #283f20, transparent 70%); }
    .timeline { width: 92%; padding: 23px 20px; background: #191e18; border: 1px solid #3a4730; border-radius: 16px; box-shadow: 0 28px 80px #0005; transform: rotate(-9deg); position: relative; }
    .ruler { display: flex; justify-content: space-between; font-family: monospace; font-size: 10px; color: #929d89; padding: 0 0 15px; }
    .track { display: flex; gap: 7px; margin: 7px 0; height: 43px; }
    .clip { flex: 1; border-radius: 5px; background: #c8ff7a; }
    .clip:nth-child(2) { flex: 1.8; background: #8cac6d; }
    .track.second { width: 77%; margin-left: 12%; height: 29px; }
    .second .clip { background: repeating-linear-gradient(90deg, #637555 0 3px, #3b4d30 3px 7px); }
    .playhead { position: absolute; top: 16px; bottom: 16px; left: 57%; width: 2px; background: #f7fff0; box-shadow: 0 0 12px #fff3; }
    .playhead::before { content: ""; position: absolute; top: -1px; left: -4px; border-top: 8px solid #f7fff0; border-left: 5px solid transparent; border-right: 5px solid transparent; }
    footer { border-top: 1px solid #293025; padding-top: 22px; color: #939b8c; font-size: 12px; line-height: 1.5; }
    @media (max-width: 720px) { .page { padding: 25px 7vw; } main { grid-template-columns: 1fr; gap: 45px; padding: 70px 0 50px; } h1 { font-size: clamp(64px, 14vw, 95px); } p { font-size: 16px; } .visual { width: min(100%, 350px); justify-self: center; } footer { align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 5h8l6 15L23 5h7L18 29h-4L3 5Z" fill="currentColor"/></svg>VeloEdit</div>
      <span class="domain">veloedit.ru</span>
    </header>
    <main>
      <section aria-labelledby="title">
        <div class="status">Сайт в разработке</div>
        <h1 id="title">Скоро<br><span>в кадре.</span></h1>
        <p>VeloEdit — видеоредактор для macOS с локальным AI. Готовим для него новый сайт. Увидимся здесь совсем скоро.</p>
        <a class="link" href="https://github.com/007danlin/VeloEdit">VeloEdit на GitHub <span aria-hidden="true">↗</span></a>
      </section>
      <div class="visual" aria-hidden="true">
        <div class="timeline">
          <div class="ruler"><span>00:00</span><span>00:15</span><span>00:30</span><span>00:45</span></div>
          <div class="track"><div class="clip"></div><div class="clip"></div><div class="clip"></div></div>
          <div class="track second"><div class="clip"></div></div>
          <div class="playhead"></div>
        </div>
      </div>
    </main>
    <footer><span>© 2026 VeloEdit</span><span>Создано для macOS.</span></footer>
  </div>
</body>
</html>
