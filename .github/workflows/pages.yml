name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare static site and current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -R website/. _site/
          rm -f _site/_headers _site/_redirects _site/_routes.json _site/README.md
          touch _site/.nojekyll
          gh api repos/007danlin/VeloEdit/releases/latest > _site/release.json
          curl --fail --location --retry 3 --max-time 60 https://github.com/007danlin/VeloEdit/releases/latest/download/appcast.xml -o _site/updates/appcast.xml
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {selectRelease} from './website/release.mjs'; if (!selectRelease(JSON.parse(readFileSync('_site/release.json')))) throw new Error('No valid release');"
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('_site/updates/appcast.xml').getroot(); assert r.find('channel/item/enclosure') is not None"
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference -cvf "$RUNNER_TEMP/artifact.tar" -C _site .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
