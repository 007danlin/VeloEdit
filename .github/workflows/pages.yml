name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'Scripts/validate-update-feed.py'
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-after-release:
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pages permits deployments from main. A release event runs on its tag,
      # so request a main-branch deployment without changing environment rules.
      - name: Request website deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve latest DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/007danlin/VeloEdit/releases/latest > website/release.json
          node --input-type=module -e 'import fs from "node:fs"; import {selectRelease} from "./website/release.mjs"; if (!selectRelease(JSON.parse(fs.readFileSync("website/release.json")))) throw new Error("Latest release has no universal DMG");'
      - name: Use signed update feed from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e '.assets[] | select(.name == "appcast.xml")' website/release.json > /dev/null; then
            tag=$(jq -r '.tag_name' website/release.json)
            gh release download "$tag" --repo 007danlin/VeloEdit --pattern appcast.xml --dir website/updates --clobber
            python3 Scripts/validate-update-feed.py website/updates/appcast.xml website/release.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
